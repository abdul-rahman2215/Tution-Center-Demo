<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#EDF3FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#142B4A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bgLight)"/>

  <!-- Concept Nodes & Connections -->
  <path d="M 150 200 L 300 120 L 450 200 L 300 280 Z" fill="none" stroke="#356AE6" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="300" y1="120" x2="300" y2="280" stroke="#FFB547" stroke-width="2"/>

  <!-- Central Node -->
  <circle cx="300" cy="200" r="50" fill="#142B4A" filter="url(#shadow)"/>
  <text x="300" y="195" fill="#FFFDF7" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CONCEPT</text>
  <text x="300" y="215" fill="#FFB547" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">MASTERY</text>

  <!-- Node 1: Clear Explanations -->
  <g transform="translate(150, 200)">
    <circle cx="0" cy="0" r="36" fill="#356AE6" filter="url(#shadow)"/>
    <!-- Lightbulb Icon -->
    <path d="M -8 -10 C -8 -18 8 -18 8 -10 C 8 -4 3 0 3 6 L -3 6 C -3 0 -8 -4 -8 -10 Z" fill="#FFFDF7"/>
    <rect x="-4" y="9" width="8" height="3" fill="#FFFDF7"/>
    <text x="0" y="52" fill="#142B4A" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Explanations</text>
  </g>

  <!-- Node 2: Guided Practice -->
  <g transform="translate(300, 120)">
    <circle cx="0" cy="0" r="36" fill="#FFB547" filter="url(#shadow)"/>
    <!-- Pencil Icon -->
    <path d="M -8 8 L 8 -8 L 12 -4 L -4 12 Z" fill="#142B4A"/>
    <text x="0" y="-48" fill="#142B4A" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Practice</text>
  </g>

  <!-- Node 3: Regular Revision -->
  <g transform="translate(450, 200)">
    <circle cx="0" cy="0" r="36" fill="#356AE6" filter="url(#shadow)"/>
    <!-- Refresh Icon -->
    <path d="M -8 0 A 8 8 0 1 1 0 8" fill="none" stroke="#FFFDF7" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="52" fill="#142B4A" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Revision</text>
  </g>

  <!-- Node 4: Doubt Support -->
  <g transform="translate(300, 280)">
    <circle cx="0" cy="0" r="36" fill="#142B4A" filter="url(#shadow)"/>
    <text x="0" y="6" fill="#FFB547" font-family="'Poppins', sans-serif" font-size="22" font-weight="700" text-anchor="middle">?</text>
    <text x="0" y="54" fill="#142B4A" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Doubt Support</text>
  </g>
</svg>
