<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDF3FF"/>
      <stop offset="100%" stop-color="#FFFDF7"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B4A"/>
      <stop offset="100%" stop-color="#0D1C31"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#356AE6"/>
      <stop offset="100%" stop-color="#2555C7"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#142B4A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Classroom Board -->
  <rect x="50" y="40" width="700" height="260" rx="12" fill="url(#boardGrad)" filter="url(#dropShadow)"/>
  <rect x="60" y="50" width="680" height="240" rx="8" fill="none" stroke="#FFB547" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Chalkboard Content -->
  <text x="90" y="95" fill="#FFFDF7" font-family="'Poppins', sans-serif" font-size="22" font-weight="700">MY TUITION CENTER — CLASSROOM</text>
  <text x="90" y="130" fill="#FFB547" font-family="'Inter', sans-serif" font-size="16" font-weight="600">✓ Interactive Learning  •  ✓ Concept Mastery  •  ✓ Board Prep</text>
  
  <!-- Math Formula Illustrations on Board -->
  <path d="M 90 170 C 130 140, 170 200, 210 170" fill="none" stroke="#EDF3FF" stroke-width="3" stroke-linecap="round"/>
  <text x="230" y="175" fill="#EDF3FF" font-family="monospace" font-size="16">E = mc²</text>
  <text x="90" y="215" fill="#EDF3FF" font-family="monospace" font-size="16">a² + b² = c²</text>
  <text x="230" y="215" fill="#EDF3FF" font-family="monospace" font-size="16">pH = -log[H+]</text>
  <circle cx="450" cy="180" r="35" fill="none" stroke="#FFB547" stroke-width="2"/>
  <line x1="450" y1="180" x2="480" y2="160" stroke="#FFB547" stroke-width="2"/>
  <text x="440" y="185" fill="#FFB547" font-family="sans-serif" font-size="12">r</text>

  <!-- Desk & Learning Station -->
  <rect x="80" y="320" width="640" height="20" rx="4" fill="#356AE6"/>
  <rect x="100" y="340" width="20" height="130" fill="#142B4A" opacity="0.8"/>
  <rect x="680" y="340" width="20" height="130" fill="#142B4A" opacity="0.8"/>

  <!-- Teacher Figure -->
  <g transform="translate(560, 180)">
    <!-- Body -->
    <path d="M 30 110 Q 50 60 70 110 L 80 180 L 20 180 Z" fill="url(#accentBlue)"/>
    <!-- Head -->
    <circle cx="50" cy="40" r="22" fill="#FFC9A4"/>
    <!-- Hair -->
    <path d="M 30 35 C 30 15, 70 15, 70 35 Z" fill="#142B4A"/>
    <!-- Book in Hand -->
    <rect x="0" y="90" width="35" height="45" rx="3" fill="#FFB547" transform="rotate(-15)"/>
  </g>

  <!-- Student Figure 1 -->
  <g transform="translate(180, 240)">
    <circle cx="40" cy="35" r="20" fill="#F3D2B8"/>
    <path d="M 22 28 C 22 10, 58 10, 58 28 Z" fill="#333B48"/>
    <path d="M 15 80 Q 40 50 65 80 L 70 130 L 10 130 Z" fill="#FFB547"/>
    <!-- Laptop / Book -->
    <rect x="15" y="75" width="50" height="30" rx="4" fill="#EDF3FF" stroke="#142B4A" stroke-width="2"/>
  </g>

  <!-- Student Figure 2 -->
  <g transform="translate(360, 240)">
    <circle cx="40" cy="35" r="20" fill="#E0AC69"/>
    <path d="M 24 30 C 24 12, 56 12, 56 30 Z" fill="#142B4A"/>
    <path d="M 15 80 Q 40 50 65 80 L 70 130 L 10 130 Z" fill="#356AE6"/>
    <!-- Notebook -->
    <rect x="20" y="70" width="40" height="35" rx="3" fill="#FFFDF7" stroke="#FFB547" stroke-width="2"/>
  </g>
</svg>
